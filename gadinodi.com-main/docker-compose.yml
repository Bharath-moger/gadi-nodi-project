services:
  postgres:
    image: postgres:16-alpine
    container_name: gadinodi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gadinodi
      POSTGRES_USER: gadinodi
      POSTGRES_PASSWORD: gadinodi
    ports:
      - "5432:5432"
    volumes:
      - gadinodi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadinodi -d gadinodi"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gadinodi_postgres_data:
